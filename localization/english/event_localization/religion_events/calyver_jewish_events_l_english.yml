l_english:
 jewish_events.0001.concubinage.t: "The End of [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] Concubinage"
 jewish_events.0001.concubinage.desc: "Throughout the centuries, it has been unclear whether or not taking concubines is permissible, but following a small council of [ROOT.Char.GetFaith.GetName]'s most influential Rabbis, it has been decided that concubinage is no longer a practice permitted by the [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] faith.\n\nThe decision is motivated largely from concern that unions lacking the full sanctity and legal obligations of marriage lead to strife, and that keeping concubines can lead to domestic discord and sinful acts of jealousy within the household."

 jewish_events.0001.harem.t: "The End of the [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] [ROOT.Char.Custom('harem_uppercase_localization')]"
 jewish_events.0001.harem.desc: "Throughout the centuries, it has been unclear whether or not taking multiple spouses and concubines is permissible, but following a small council of [ROOT.Char.GetFaith.GetName]'s most influential Rabbis, it has been decided that neither polygamy nor concubinage are practices permitted by the [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] faith.\n\nThe decision is motivated largely from concern that one person would not be able to adequately provide for a vast household of spouses and concubines, and that such extensive unions lead to bitter rivalry, domestic discord, and sinful acts of jealousy within the home."
